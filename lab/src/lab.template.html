<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zeldara Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0b0e1a; --surface:#131a2c; --surface2:#1a2240; --line:#2a3458; --soft:#202a4a;
  --text:#ebe6d6; --muted:#9ea6c2; --faint:#6b7496;
  --rune:#6fe3f5; --rune-dim:rgba(111,227,245,.14); --amber:#f0b44c;
  --pick:#7fd89a; --maybe:#f0c060; --no:#e8808a;
  --display:'Marcellus SC','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;
  background:radial-gradient(1100px 480px at 80% -140px,rgba(111,227,245,.08),transparent 60%),var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--rune);outline-offset:2px}
code{font-family:var(--mono);font-size:.85em;background:var(--surface2);padding:0 .35em;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,14,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--soft);padding:12px 16px}
.top .row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.06em;margin:0}
h1 .g{color:var(--rune);text-shadow:0 0 12px rgba(111,227,245,.6)}
#lab-save{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-left:auto}
#lab-save.warn{color:var(--amber)}
#lab-tabs{display:flex;gap:6px;flex-wrap:wrap}
.lab-tab{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.lab-tab[aria-selected="true"]{background:var(--rune-dim);border-color:var(--rune);color:var(--text)}
.lab-tab .n{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.lab-tab .n.soon{color:var(--amber)}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
#lab-tab-blurb{max-width:80ch;color:var(--muted);margin:0 0 18px}
#lab-tab-blurb b{color:var(--text);font-weight:500}
#lab-tab-blurb .ring{display:inline-block;width:10px;height:10px;border:1.5px solid rgba(255,70,70,.8);border-radius:50%;vertical-align:-1px;background:rgba(255,60,60,.18)}
#lab-grid .lab-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lab-groups{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.lab-grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--muted);font-family:var(--display);letter-spacing:.04em}
.lab-grp[aria-pressed="true"]{border-color:var(--rune);color:var(--text);background:var(--rune-dim)}
.lab-grp .n{font-family:var(--mono);font-size:.72rem;color:var(--pick);margin-left:6px}
.lab-card .thumb .rendering{display:flex;height:100%;align-items:center;justify-content:center;color:var(--faint);font-size:.8rem;font-style:normal}
.lab-card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--soft);border-radius:10px;overflow:hidden;padding:0;transition:border-color .15s,transform .15s}
.lab-card:hover{border-color:var(--rune);transform:translateY(-2px)}
.lab-card .thumb{display:block;aspect-ratio:3/2;background:#000 center/cover no-repeat;border-bottom:1px solid var(--soft)}
.lab-card .num{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:.75rem;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--rune)}
.lab-card .verdict{position:absolute;top:8px;right:8px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 8px;background:rgba(0,0,0,.65)}
.v-pick{color:var(--pick);border:1px solid var(--pick)} .v-maybe{color:var(--maybe);border:1px solid var(--maybe)} .v-no{color:var(--no);border:1px solid var(--no)}
.lab-card[data-verdict="no"] .thumb{filter:grayscale(.7) brightness(.7)}
.lab-card .cap{display:flex;flex-direction:column;padding:10px 12px 12px;gap:2px}
.lab-card .cap b{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.02em}
.lab-card .cap span{color:var(--muted);font-size:.9rem}
.lab-card .cap em{color:var(--rune);font-size:.8rem;font-style:normal}
.lab-empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;max-width:70ch}
/* walk view */
#lab-walk{display:none}
body.walking #lab-browse{display:none}
body.walking #lab-walk{display:grid;grid-template-columns:1fr 340px;gap:0;height:calc(100vh - 62px)}
body.walking main{max-width:none;padding:0}
#lab-stage{position:relative;background:#000;min-height:420px;overflow:hidden}
#lab-stage canvas{display:block;outline:none}
#lab-stage .hint{position:absolute;left:12px;bottom:10px;font-size:.8rem;color:#cfd6ea;background:rgba(0,0,0,.55);border-radius:6px;padding:3px 8px;pointer-events:none}
#lab-panel{background:var(--surface);border-left:1px solid var(--soft);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#lab-panel .p-top{display:flex;gap:6px;align-items:center}
#lab-panel .nav{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:4px 10px}
#lab-panel .pos{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-left:auto}
#lab-panel h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:4px 0 0;letter-spacing:.03em}
#lab-panel .blurb{margin:0;color:#cdd0de}
#lab-panel .facts{margin:0;padding-left:1.1em;color:var(--muted);font-size:.9rem}
.sec-l{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.verdicts,.regions{display:flex;gap:6px;flex-wrap:wrap}
.vbtn,.reg{background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 12px;color:var(--muted)}
.vbtn[data-v="pick"][aria-pressed="true"]{border-color:var(--pick);color:var(--pick);background:rgba(127,216,154,.14)}
.vbtn[data-v="maybe"][aria-pressed="true"]{border-color:var(--maybe);color:var(--maybe);background:rgba(240,192,96,.14)}
.vbtn[data-v="no"][aria-pressed="true"]{border-color:var(--no);color:var(--no);background:rgba(232,128,138,.14)}
.reg[aria-pressed="true"]{border-color:var(--rune);color:var(--text);background:var(--rune-dim)}
#lab-notes{width:100%;min-height:90px;resize:vertical;background:var(--ink);color:var(--text);border:1px solid var(--soft);border-radius:8px;padding:8px 10px;font:inherit;font-size:.93rem}
.keys{font-size:.8rem;color:var(--faint);margin-top:auto}
.keys b{color:var(--muted);font-weight:500}
#lab-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(10,14,28,.94);border:1px solid var(--rune);color:var(--text);border-radius:10px;padding:8px 16px;font-size:.95rem;max-width:min(560px,90vw);text-align:center;transition:all .25s;z-index:50;pointer-events:none}
#lab-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* sprites tab */
#lab-grid.custom{display:block}
.map-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:0 0 10px}
.map-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.map-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.map-tg{display:flex;gap:6px;flex-wrap:wrap}
.map-t,.map-z{background:transparent;border:1px solid var(--line);border-radius:7px;padding:3px 10px;color:var(--muted);font-size:.85rem}
.map-t[aria-pressed="true"]{border-color:var(--rune);color:var(--text);background:var(--rune-dim)}
#map-wrap{position:relative;overflow:auto;max-height:78vh;border:1px solid var(--soft);border-radius:10px;background:#081426}
#map-cv{display:block;margin:0 auto;image-rendering:auto}
#map-tip{position:absolute;display:none;pointer-events:none;background:rgba(10,14,28,.94);border:1px solid var(--rune);border-radius:8px;padding:5px 9px;font-size:.85rem;color:var(--text);white-space:nowrap}
#map-tip span{color:var(--faint);font-size:.78rem}
.map-notes{margin-top:12px;max-width:760px}
#map-notes{width:100%;min-height:80px;background:var(--ink);color:var(--text);border:1px solid var(--soft);border-radius:8px;padding:8px 10px;font:inherit}

.sp-hero{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--soft);border-radius:10px;padding:14px;margin-bottom:22px;max-width:900px}
.sp-hero-img{width:96px;height:158px;flex:none;background:#2f6a3a center/contain no-repeat;image-rendering:pixelated;border-radius:8px}
.sp-hero p{margin:4px 0 8px;color:var(--muted);max-width:70ch}
.sp-char{margin:0 0 26px}
.sp-char h3{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 10px;letter-spacing:.03em}
.sp-char h3 span{font-family:var(--body);font-size:.85rem;color:var(--muted);margin-left:8px}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sp-card{background:var(--surface);border:1px solid var(--soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sp-card[data-verdict="pick"]{border-color:var(--pick)} .sp-card[data-verdict="no"]{opacity:.6}
.sp-img{aspect-ratio:1/1;border-radius:8px;background:#233a2a center/contain no-repeat;image-rendering:pixelated;display:flex;align-items:center;justify-content:center}
.sp-img.empty{background:repeating-linear-gradient(45deg,#141b2e,#141b2e 8px,#18203a 8px,#18203a 16px);border:1px dashed var(--line)}
.sp-img span{font-size:.8rem;color:var(--faint)}
.sp-card b{font-weight:500;font-size:.95rem}
.sp-card p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.35}
.sp-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.sp-copy{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:.85rem}
.sp-actions .vbtn{padding:4px 9px;font-size:.85rem}
@media (max-width:820px){
  body.walking #lab-walk{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}
  #lab-panel{border-left:0;border-top:1px solid var(--soft)}
}
@media (prefers-reduced-motion:reduce){ .lab-card{transition:none} #lab-toast{transition:none} }
</style>
</head>
<body>
<header class="top"><div class="row">
  <h1><span class="g">ᛉ</span> Zeldara Design Lab</h1>
  <nav id="lab-tabs" role="tablist"></nav>
  <span id="lab-save">Connecting…</span>
</div></header>
<main>
  <section id="lab-browse">
    <p id="lab-tab-blurb"></p>
    <div id="lab-grid"></div>
  </section>
  <section id="lab-walk">
    <div id="lab-stage"><span class="hint">Click here, then use WASD / arrows · Shift to run · Tab to inspect</span></div>
    <aside id="lab-panel"></aside>
  </section>
</main>
<div id="lab-toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
{{JS}}
LabApp.init();
</script>
</body>
</html>
